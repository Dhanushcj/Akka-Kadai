<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sri Vishnu Madha - Premium Gold Pawn Shop Management System. Secure ornament tracking, loan ledger, and automated receipt generation." />
    <meta name="theme-color" content="#D4AF37" />
    <title>Sri Vishnu Madha | Gold Pawn Management</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('Service Worker registered');
              // Check for updates on every load and periodically
              reg.update();
              setInterval(() => reg.update(), 1000 * 60 * 60); 
            })
            .catch(err => console.log('Service Worker registration failed', err));
        });

        // Automatically reload when a new service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            window.location.reload();
            refreshing = true;
          }
        });
      }
    </script>
  </body>
</html>
